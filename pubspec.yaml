name: crabihost
description: "Crabigo Host - Property Management App for Crabigo Hosts"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Networking (Native http only, NO Dio)
  http: ^1.2.2

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Environment
  flutter_dotenv: ^5.1.0

  # Firebase
  firebase_core: ^3.4.1
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.1
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^17.2.3

  # Responsive design
  flutter_screenutil: ^5.9.3

  # Image
  cached_network_image: ^3.3.1

  # URL / WebView
  url_launcher: ^6.3.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/logo/
    - assets/images/3d/
    - assets/icons/
    - assets/animations/

